name: Build CV

on:
  push:
    branches: [ under_repair ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v2
        with:
          root_file: files/cv.tex
      
      - name: Upload PDF
        uses: actions/upload-artifact@v3
        with:
          name: CV
          path: files/Troske_Will_CV.pdf